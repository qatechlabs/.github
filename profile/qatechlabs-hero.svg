<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">QA Tech Labs — Engineering Quality. Intelligently.</title>
  <desc id="heroDesc">Premium burgundy GitHub hero, with glowing rose-gold motion trails, technical grid and QA engineering insignia.</desc>
  <defs>
    <linearGradient id="qaBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset="0.55" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
    <linearGradient id="qaMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C77B9B"/><stop offset="0.48" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
    <linearGradient id="qaRoad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset="0.48" stop-color="#C77B9B" stop-opacity="0.65"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/></linearGradient>
    <radialGradient id="qaHalo"><stop offset="0" stop-color="#701A3D" stop-opacity="0.68"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
    <pattern id="qaGrid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#C77B9B" stroke-width="0.5" opacity="0.19"/></pattern>
    <filter id="qaGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="qaCrop"><rect x="2" y="2" width="1196" height="346" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="348" rx="15" fill="url(#qaBg)" stroke="#701A3D" stroke-width="2"/>
  <g clip-path="url(#qaCrop)">
    <rect width="1200" height="350" fill="url(#qaGrid)"/>
    <ellipse cx="931" cy="155" rx="300" ry="230" fill="url(#qaHalo)"/>
    <path d="M0 42H1200 M0 310H1200" stroke="#C77B9B" stroke-width="1" opacity="0.16"/>
    <path d="M53 52h42 M53 52v24 M1145 52h-42 M1145 52v24 M53 299h42 M53 299v-24 M1145 299h-42 M1145 299v-24" fill="none" stroke="#C77B9B" stroke-width="1.4" opacity="0.72"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="71" y="78" font-size="13" font-weight="700" letter-spacing="4.8" fill="#C77B9B">QUALITY ENGINEERING  /  SYSTEMS LAB</text>
      <text x="68" y="174" font-size="76" font-weight="800" letter-spacing="1.6" fill="#F8F0F3">QA TECH LABS</text>
      <path d="M72 191H648" stroke="#701A3D" stroke-width="5" stroke-linecap="round"/>
      <path d="M72 191H648" stroke="url(#qaMetal)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="115 470">
        <animate attributeName="stroke-dashoffset" values="0;-585" dur="6s" repeatCount="indefinite"/>
      </path>
      <text x="71" y="232" font-size="20" font-weight="600" letter-spacing="0.6" fill="#E5B5C7">Engineering Quality. Intelligently.</text>
      <text x="71" y="267" font-size="12" letter-spacing="2.3" fill="#F8F0F3" opacity="0.78">AUTOMATION  ·  AI-ASSISTED TESTING  ·  OPEN SOURCE</text>
      <text x="71" y="322" font-size="10" letter-spacing="3.1" fill="#C77B9B">PLAYWRIGHT   /   TYPESCRIPT   /   API QUALITY   /   CI/CD</text>
    </g>
    <!-- Engineering circuit with authentic motion; static appearance is also intentional -->
    <path id="qaCircuit" d="M687 192H737L769 162H818L841 183H884L903 161H987" fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.54"/>
    <path d="M687 192H737L769 162H818L841 183H884L903 161H987" fill="none" stroke="#F8F0F3" stroke-width="3" stroke-dasharray="2 36" opacity="0.72">
      <animate attributeName="stroke-dashoffset" from="0" to="-76" dur="5s" repeatCount="indefinite"/>
    </path>
    <g fill="#10070C" stroke="#C77B9B" stroke-width="2">
      <circle cx="737" cy="192" r="4"/><circle cx="769" cy="162" r="4"/><circle cx="818" cy="162" r="4"/><circle cx="841" cy="183" r="4"/>
    </g>
    <g filter="url(#qaGlow)"><circle r="3.5" fill="#F8F0F3"><animateMotion dur="8s" repeatCount="indefinite" path="M687 192H737L769 162H818L841 183H884L903 161H987"/></circle></g>
    <!-- Restrained orbital precision geometry -->
    <circle cx="983" cy="171" r="116" fill="none" stroke="#C77B9B" stroke-opacity="0.18"/>
    <circle cx="983" cy="171" r="97" fill="none" stroke="#E5B5C7" stroke-opacity="0.46" stroke-dasharray="4 12">
      <animateTransform attributeName="transform" type="rotate" from="0 983 171" to="360 983 171" dur="70s" repeatCount="indefinite"/>
    </circle>
    <circle cx="983" cy="171" r="70" fill="#190B12" fill-opacity="0.62" stroke="url(#qaMetal)" stroke-width="2.1"/>
    <circle cx="983" cy="171" r="83" fill="none" stroke="#701A3D" stroke-width="10" opacity="0.26"/>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#F8F0F3" text-anchor="middle">
      <text x="983" y="181" font-size="40" letter-spacing="-3">QA</text>
    </g>
    <path d="M958 196l14 13 28-26" fill="none" stroke="#C77B9B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1101 103h20v20 M865 274h-20v-20" fill="none" stroke="#C77B9B" stroke-width="1.3" opacity="0.6"/>
    <circle cx="1129" cy="289" r="3" fill="#C77B9B"/>
    <circle cx="1145" cy="289" r="3" fill="#C77B9B" opacity="0.5"/>
    <circle cx="1161" cy="289" r="3" fill="#C77B9B" opacity="0.25"/>
  </g>
</svg>
